name: ZAP Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  zapscan:
    runs-on: ubuntu-latest
    name: OWASP ZAP Security Scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install backend dependencies
        working-directory: ./golang-gin-realworld-example-app
        run: go mod download

      - name: Install frontend dependencies
        working-directory: ./react-redux-realworld-example-app
        run: npm ci

      - name: Start backend server
        working-directory: ./golang-gin-realworld-example-app
        run: |
          go build -o realworld-backend
          ./realworld-backend &
          echo "Waiting for backend to start..."
          sleep 10
          # Verify backend is running
          curl -f http://localhost:8080/api/tags || echo "Backend not ready yet"

      - name: Start frontend server
        working-directory: ./react-redux-realworld-example-app
        run: |
          npm start &
          echo "Waiting for frontend to start..."
          sleep 15
          # Wait for frontend to be ready
          timeout 60 bash -c 'until curl -f http://localhost:4100; do sleep 2; done' || echo "Frontend not ready"

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:4100"
          rules_file_name: "zap.yaml"
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zapscanreports

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-reports
          path: |
            report_html.html
            report_md.md
            report_json.json
          retention-days: 30

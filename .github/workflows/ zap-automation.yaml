name: ZAP Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    name: OWASP ZAP Security Scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install backend dependencies
        working-directory: ./golang-gin-realworld-example-app
        run: go mod download

      - name: Install frontend dependencies
        working-directory: ./react-redux-realworld-example-app
        run: npm ci

      - name: Start backend server
        working-directory: ./golang-gin-realworld-example-app
        run: |
          go build -o realworld-backend
          ./realworld-backend &
          sleep 5

      - name: Start frontend server
        working-directory: ./react-redux-realworld-example-app
        run: |
          npm start &
          sleep 10

      - name: Create ZAP automation plan
        run: |
          cat > zap-plan.yaml << 'EOF'
          env:
            contexts:
              - name: "Conduit"
                urls:
                  - "http://localhost:4100"
                authentication:
                  method: "json"
                  parameters:
                    loginUrl: "http://localhost:8080/api/users/login"
                    loginRequestData: |
                      {
                        "user": {
                          "email": "security-test@example.com",
                          "password": "SecurePass123!"
                        }
                      }
                  verification:
                    method: "response"
                    loggedInRegex: "\\Quser\\E.*\\Qtoken\\E"
                sessionManagement:
                  method: "header"
                  parameters:
                    headerName: "Authorization"
                users:
                  - name: "testuser"
                    credentials:
                      email: "security-test@example.com"
                      password: "SecurePass123!"

          jobs:
            - type: spider
              parameters:
                context: "Conduit"
                user: "testuser"
                maxDuration: 10
            
            - type: activeScan
              parameters:
                context: "Conduit"
                user: "testuser"
                policy: "API-scan-minimal"
            
            - type: report
              parameters:
                template: "traditional-html"
                reportDir: /zap/wrk/
                reportFile: active-scan-report.html
          EOF

      - name: Run ZAP scan
        uses: zaproxy/action-full-scan@v0.8.0
        with:
          target: "http://localhost:4100"
          rules_file_name: "zap-plan.yaml"
          cmd_options: "-a"
          allow_issue_writing: false

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-report
          path: |
            active-scan-report.html
            zap-passive-report.html
